name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle-Version kommt aus dem Wrapper (gradle/wrapper/gradle-wrapper.properties)
      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher
          path: tv-launcher.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: TV Launcher 0.2.${{ github.run_number }}
          files: tv-launcher.apk
          make_latest: true
